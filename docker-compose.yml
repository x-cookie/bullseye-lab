services:
  bullseye:
    build: .
    env_file:
      - .env
    volumes:
      - bullseye_data:/home/appuser/.bullseye
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  bullseye-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - bullseye_data:/home/appuser/.bullseye
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  bullseye_data:
  ollama_data:
